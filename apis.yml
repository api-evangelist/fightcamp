aid: fightcamp
name: Fightcamp
description: 'FightCamp is a consumer connected-fitness company that sells an at-home
  boxing and kickboxing training system combining physical equipment (a free-standing
  bag, quick-wrap gloves, and Bluetooth motion-tracking punch trackers) with a subscription
  app of on-demand classes led by professional fighters. The trackers use motion sensors
  and AI to measure punch output, speed, and workout stats, syncing to a member app
  and customer dashboard for progress tracking. FightCamp is a direct-to-consumer
  hardware-plus-membership business (backed by IVP) and does not publish a public
  developer API; this profile captures its public web, commerce, support, and domain-security
  surface for the API Evangelist network.'
